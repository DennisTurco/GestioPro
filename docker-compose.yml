services:
  db:
    container_name: postgres-gestiopro
    image: postgres:latest
    environment:
      POSTGRES_DB: gestiopro
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Pa55w0rd
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

  mailpit:
    container_name: mailpit-gestiopro
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
