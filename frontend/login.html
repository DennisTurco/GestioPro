<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
    <title>Login - GestioPro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg, 12px);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .logo-icon {
            width: 48px; height: 48px;
            background: var(--color-primary);
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 22px; color: #fff;
            margin-bottom: 12px;
        }
        .login-logo h1 { font-size: 22px; font-weight: 700; margin: 0; }
        .login-logo p { font-size: 13px; color: var(--color-text-muted, #94a3b8); margin: 4px 0 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .form-group input {
            width: 100%; box-sizing: border-box;
            padding: 10px 12px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius, 8px);
            color: var(--color-text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--color-primary); }
        .btn-login {
            width: 100%; padding: 11px;
            background: var(--color-primary);
            color: #fff; border: none;
            border-radius: var(--radius, 8px);
            font-size: 14px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.88; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-error {
            color: #f87171; font-size: 13px;
            text-align: center; margin-top: 12px;
            min-height: 20px;
        }
        .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--color-text-muted, #94a3b8); }
        .login-footer a { color: var(--color-primary); text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <div class="logo-icon"><img src="./public/icon.svg"></div>
        <h1>GestioPro</h1>
        <p>Accedi al tuo account</p>
    </div>

    <div id="form-login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Il tuo username" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="La tua password" autocomplete="current-password">
        </div>
        <button class="btn-login" id="btn-login" onclick="doLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> Accedi
        </button>
        <div class="login-error" id="login-error"></div>
        <div class="login-footer">Non hai un account? <a onclick="showRegister()">Registrati</a></div>
    </div>

    <div id="form-register" style="display:none">
        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="reg-name" placeholder="Nome">
        </div>
        <div class="form-group">
            <label>Cognome</label>
            <input type="text" id="reg-surname" placeholder="Cognome">
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="Username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="email@esempio.it">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Password">
        </div>
        <button class="btn-login" id="btn-register" onclick="doRegister()">
            <i class="fa-solid fa-user-plus"></i> Crea account
        </button>
        <div class="login-error" id="register-error"></div>
        <div class="login-footer"><a onclick="showLogin()">â† Torna al login</a></div>
    </div>
</div>

<script src="src/api.ts"></script>
<script src="src/user.api.ts"></script>
<script src="src/store/user.store.ts"></script>

<script>
// If already authenticated, go straight to dashboard
(async () => {
    const token = localStorage.getItem('auth_token');
    if (token) {
        try {
            await UserStore.load();
            if (UserStore.isAuthenticated()) {
                window.location.href = 'index.html';
            }
        } catch {}
    }
})();

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('btn-login');

    errEl.textContent = '';
    if (!username || !password) { errEl.textContent = 'Inserisci username e password.'; return; }

    btn.disabled = true;
    btn.textContent = 'Accesso in corso...';

    try {
        await UserStore.login(username, password);
        window.location.href = 'index.html';
    } catch (e) {
        errEl.textContent = e.message || 'Credenziali non valide.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Accedi';
    }
}

async function doRegister() {
    const errEl = document.getElementById('register-error');
    const btn = document.getElementById('btn-register');
    const data = {
        name:     document.getElementById('reg-name').value.trim(),
        surname:  document.getElementById('reg-surname').value.trim(),
        username: document.getElementById('reg-username').value.trim(),
        email:    document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
    };

    errEl.textContent = '';
    if (!data.name || !data.surname || !data.username || !data.email || !data.password) {
        errEl.textContent = 'Compila tutti i campi.'; return;
    }

    btn.disabled = true;
    btn.textContent = 'Registrazione in corso...';

    try {
        await UserAPI.register(data);
        // Auto-login after register
        await UserStore.login(data.username, data.password);
        window.location.href = 'index.html';
    } catch (e) {
        errEl.textContent = e.message || 'Errore durante la registrazione.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Crea account';
    }
}

function showRegister() {
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-register').style.display = 'block';
}
function showLogin() {
    document.getElementById('form-register').style.display = 'none';
    document.getElementById('form-login').style.display = 'block';
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        if (document.getElementById('form-register').style.display !== 'none') doRegister();
        else doLogin();
    }
});
</script>

</body>
</html>
