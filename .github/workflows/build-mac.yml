# Builds the macOS installers (.dmg for Apple Silicon and Intel) on every
# push/merge to master, or manually: Actions tab > "Build macOS installers"
# > Run workflow. Also called by release.yml when a "v*" tag is pushed.
# The app is ad-hoc signed only (no Apple Developer ID / notarization yet).
name: Build macOS installers

on:
  push:
    branches: [master]
    # Docs-only changes don't need new installers
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (tag without the leading "v")
        type: string
        required: true

jobs:
  build-mac:
    # Apple Silicon runner; the Intel build is cross-published/packaged below
    runs-on: macos-latest
    # A newer push supersedes a build still running for an older one. Set on
    # the job, not the workflow: when called by release.yml, github.workflow
    # is the caller's name and the three platform builds would cancel each other.
    concurrency:
      group: build-mac-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Release builds take the tag's version, the others the one in installer/GestioPro.iss
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/.*#define AppVersion *"\(.*\)".*/\1/p' installer/GestioPro.iss)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # appsettings.Production.json is gitignored (Supabase connection string,
      # Jwt secret): it comes from the APPSETTINGS_PRODUCTION_JSON repo secret
      - name: Write production settings
        env:
          APPSETTINGS_PRODUCTION_JSON: ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
        run: |
          if [ -n "$APPSETTINGS_PRODUCTION_JSON" ]; then
            printf '%s' "$APPSETTINGS_PRODUCTION_JSON" > GestioPro.Api/appsettings.Production.json
            # The secret must hold the whole file, not a single value: an invalid
            # file makes the packaged backend crash at startup
            node -e "JSON.parse(require('fs').readFileSync('GestioPro.Api/appsettings.Production.json', 'utf8'))" 2>/dev/null || {
              echo "::error::APPSETTINGS_PRODUCTION_JSON is not valid JSON: paste the whole appsettings.Production.json content, braces and quotes included"
              exit 1
            }
          elif [ -n "${{ inputs.version }}" ]; then
            echo "::error::APPSETTINGS_PRODUCTION_JSON secret not set: a release would ship without a database connection"
            exit 1
          else
            echo "::warning::APPSETTINGS_PRODUCTION_JSON secret not set: the installers fall back to the dev settings"
          fi

      # Self-contained: end users don't need the .NET runtime installed.
      # Output folders picked up by package.json > build.mac.extraResources
      # ("osx-${arch}"). On a macOS host the SDK ad-hoc signs the apphost.
      - name: Publish backend
        run: |
          for RID in osx-arm64 osx-x64; do
            dotnet publish GestioPro.Api -c Release -r "$RID" --self-contained true -o "GestioPro.Api/bin/Release/net10.0/$RID/publish"
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

      - name: Package macOS installers
        working-directory: frontend
        run: npx electron-builder --mac --publish never --config.extraMetadata.version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: GestioPro-mac
          path: frontend/dist-electron/*.dmg
          if-no-files-found: error
