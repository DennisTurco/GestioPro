# Builds the Windows installer (Inno Setup .exe) on every push/merge to
# master, or manually: Actions tab > "Build Windows installer" > Run workflow.
# Also called by release.yml when a "v*" tag is pushed.
name: Build Windows installer

on:
  push:
    branches: [master]
    # Docs-only changes don't need new installers
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (tag without the leading "v")
        type: string
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    # A newer push supersedes a build still running for an older one. Set on
    # the job, not the workflow: when called by release.yml, github.workflow
    # is the caller's name and the three platform builds would cancel each other.
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Release builds take the tag's version, the others the one in installer/GestioPro.iss
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/.*#define AppVersion *"\(.*\)".*/\1/p' installer/GestioPro.iss)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # appsettings.Production.json is gitignored (Supabase connection string,
      # Jwt secret): it comes from the APPSETTINGS_PRODUCTION_JSON repo secret
      - name: Write production settings
        env:
          APPSETTINGS_PRODUCTION_JSON: ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
        run: |
          if [ -n "$APPSETTINGS_PRODUCTION_JSON" ]; then
            printf '%s' "$APPSETTINGS_PRODUCTION_JSON" > GestioPro.Api/appsettings.Production.json
            # The secret must hold the whole file, not a single value: an invalid
            # file makes the packaged backend crash at startup
            node -e "JSON.parse(require('fs').readFileSync('GestioPro.Api/appsettings.Production.json', 'utf8'))" 2>/dev/null || {
              echo "::error::APPSETTINGS_PRODUCTION_JSON is not valid JSON: paste the whole appsettings.Production.json content, braces and quotes included"
              exit 1
            }
          elif [ -n "${{ inputs.version }}" ]; then
            echo "::error::APPSETTINGS_PRODUCTION_JSON secret not set: a release would ship without a database connection"
            exit 1
          else
            echo "::warning::APPSETTINGS_PRODUCTION_JSON secret not set: the installer falls back to the dev settings"
          fi

      # Self-contained: end users don't need the .NET runtime installed.
      # Output folder picked up by package.json > build.win.extraResources.
      - name: Publish backend
        run: dotnet publish GestioPro.Api -c Release -r win-x64 --self-contained true -o GestioPro.Api/bin/Release/net10.0/win-x64/publish

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

      # Produces frontend/dist-electron/win-unpacked/ (win target "dir"), the input of the Inno Setup script
      - name: Package Electron app
        working-directory: frontend
        run: npx electron-builder --win --publish never --config.extraMetadata.version="$VERSION"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\GestioPro.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: GestioPro-windows
          path: installer/Output/*.exe
          if-no-files-found: error
