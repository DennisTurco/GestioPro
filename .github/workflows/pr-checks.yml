# Runs analyze.ps1 on the files changed by every pull request to master:
# build, tests, coverage, warnings, format and NuGet audit. Fails the check
# when the script does (see the header of analyze.ps1 for the exit rules).
# Windows runner on purpose: .editorconfig requires CRLF and there is no
# .gitattributes, so a Linux checkout (LF) would fail `dotnet format` everywhere.
name: PR checks

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # Full history: analyze.ps1 -Changed needs the merge-base with the target branch
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Run analyze.ps1 on changed files
        run: |
          $PSStyle.OutputRendering = 'PlainText'
          ./analyze.ps1 -Changed -Base "origin/${{ github.base_ref }}" *>&1 | Tee-Object -FilePath analyze-output.txt
          $code = $LASTEXITCODE

          # Results Summary ... Result: line, plus the list of changed files, into the run page
          $lines   = Get-Content analyze-output.txt
          $mode    = $lines | Where-Object { $_ -match "^Mode: " }
          $start   = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match "Results Summary" })
          $summary = if ($start -ge 0) { $lines[$start..($lines.Count - 1)] | Where-Object { $_ -notmatch "^=+$|^Open reports:|^\s+(Coverage|Warnings|Format|Security)\s+:" } } else { $lines | Select-Object -Last 20 }
          @(
            "## GestioPro - PR checks"
            ""
            "$mode"
            ""
            '```'
            $summary
            '```'
            ""
            "Full report (coverage HTML, warnings, audit): **analyze-report** artifact below."
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          exit $code

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-report
          path: |
            coverage/report/
            coverage/*.txt
            analyze-output.txt
          if-no-files-found: ignore
          retention-days: 14
